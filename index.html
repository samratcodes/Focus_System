<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus System — Today</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i data-lucide="target"></i>
      <span>Focus System</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active">
        <i data-lucide="sun"></i> <span>Today</span>
        <span class="nav-badge" id="today-count">0</span>
      </a>
      <a href="calendar.html" class="nav-item">
        <i data-lucide="calendar"></i> <span>Calendar</span>
      </a>
      <a href="focus.html" class="nav-item">
        <i data-lucide="timer"></i> <span>Focus</span>
        <span class="nav-badge" id="focus-badge" style="display:none">●</span>
      </a>
      <a href="analytics.html" class="nav-item">
        <i data-lucide="bar-chart-3"></i> <span>Analytics</span>
      </a>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-label">Player Stats</div>
      <div class="quick-stats">
        <div class="level-badge-container">
          <div class="level-badge-title">
            <i data-lucide="trophy" style="width:14px;height:14px"></i>
            <span id="qs-level">Lvl 1 (0/100 XP)</span>
          </div>
        </div>
        <div class="stat-row"><span>Completed</span><span class="stat-value" id="qs-completed">0/0</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="qs-bar" style="width:0%"></div></div>
        <div class="stat-row" style="margin-top:4px"><span>Streak</span><span class="stat-value" id="qs-streak">0 days</span></div>
        <div class="stat-row"><span>Today's Focus</span><span class="stat-value" id="qs-pomos">0 sessions</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-greeting">
        <h2 id="greeting">Good morning</h2>
        <span id="header-date"></span>
      </div>
      <div class="header-search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search tasks..." id="search-input">
      </div>
      <div class="completion-bar">
        <div class="bar-track"><div class="bar-fill" id="header-bar-fill" style="width:0%"></div></div>
        <span class="bar-text" id="header-bar-text">0%</span>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="task-modal-overlay">
  <div class="modal" id="task-modal"></div>
</div>

<div class="focus-overlay" id="focus-overlay">
  <button class="overlay-exit" id="overlay-exit">Exit Focus Mode</button>
  <div class="overlay-task" id="overlay-task-name">No task selected</div>
  <div class="overlay-timer" id="overlay-timer">25:00</div>
  <div class="overlay-label" id="overlay-label">FOCUS</div>
  <div class="overlay-ambient">
    <div class="ambient-dot"></div><div class="ambient-dot"></div><div class="ambient-dot"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="shared.js"></script>
<script>
// ============================================================
// TODAY VIEW — Goal-Driven & Frictionless Task Engine
// ============================================================

function renderTodayView(){
  var tasks=getTodayTasks();
  if(state.searchQuery){
    tasks=tasks.filter(function(t){return t.title.toLowerCase().indexOf(state.searchQuery.toLowerCase())>=0});
  }
  var frog=getFrogTask();
  var html='';

  // 0. Today Summary — total / completed / completion ratio for today ONLY
  var rawToday = state.tasks.filter(function(t){ return t.dueDate === today(); });
  var rawDone = rawToday.filter(function(t){ return t.completed; }).length;
  var rawTotal = rawToday.length;
  var rawRate = rawTotal ? Math.round((rawDone / rawTotal) * 100) : 0;
  html += '<div class="today-summary">'+
    '<div class="today-summary-head"><div class="today-summary-title"><i data-lucide="sun" style="width:16px;height:16px"></i> Today\'s Progress</div><span class="today-summary-date">'+fmtDate(today())+'</span></div>'+
    '<div class="stat-strip">'+
      '<div class="stat-tile"><div class="tile-value" style="color:var(--primary)">'+rawTotal+'</div><div class="tile-label">Total Tasks</div></div>'+
      '<div class="stat-tile"><div class="tile-value" style="color:var(--success)">'+rawDone+'</div><div class="tile-label">Completed</div></div>'+
      '<div class="stat-tile"><div class="tile-value">'+rawRate+'%</div><div class="tile-label">Completion</div></div>'+
    '</div>'+
    '<div class="stat-bar" style="height:8px"><div class="stat-bar-fill" style="width:'+rawRate+'%;background:var(--success)"></div></div>'+
  '</div>';

  // 1. Goal Filter Bar
  html += '<div class="goal-section">';
  html += '<div class="goal-section-header"><div class="sidebar-label" style="padding:0">Filter by Goal</div>';
  html += '<button class="btn btn-sm btn-secondary" onclick="promptNewGoal()"><i data-lucide="plus"></i> New Goal</button></div>';
  html += '<div class="goal-pills">';
  html += '<button class="goal-pill '+(state.activeGoalId===null?'active':'')+'" onclick="setActiveGoal(null)">🎯 All Goals</button>';
  
  state.goals.forEach(function(g){
    var isSel = state.activeGoalId === g.id;
    html += '<button class="goal-pill '+(isSel?'active':'')+'" onclick="setActiveGoal(\''+g.id+'\')" style="'+(isSel?'background:'+g.color+'22;border-color:'+g.color+';color:'+g.color:'')+'">';
    html += '<span class="goal-dot" style="background:'+g.color+'"></span>';
    html += escHtml(g.title);
    html += '</button>';
  });
  html += '</div></div>';

  // 2. Eat the Frog Priority Section
  if(frog){
    html+='<div class="frog-hero"><div class="frog-icon"><i data-lucide="zap"></i></div><div class="frog-info"><div class="frog-label">Eat the Frog (+50 XP)</div><div class="frog-title">'+escHtml(frog.title)+'</div><div class="frog-meta">'+(frog.subtasks&&frog.subtasks.length?frog.subtasks.filter(function(s){return s.completed}).length+'/'+frog.subtasks.length+' subtasks':'High-impact goal task for today')+'</div></div><div class="frog-actions"><button class="btn btn-sm btn-primary" onclick="completeTask(\''+frog.id+'\')">Complete</button><button class="btn btn-sm btn-secondary" onclick="clearFrog()">Unmark</button></div></div>';
  }else{
    html+='<div class="no-frog">⚡ No priority task set. Mark a task with the lightning bolt to make it today\'s primary focus (+50 XP).</div>';
  }

  // 3. Frictionless Task Creation Box
  var qDate=state.selectedDate||today();
  var goalOptions = '<option value="">🎯 Standalone Task</option>' + 
    state.goals.map(function(g){ 
      return '<option value="'+g.id+'"'+(state.activeGoalId===g.id?' selected':'')+'>🎯 '+escHtml(g.title)+'</option>'; 
    }).join('');

  html+='<div class="add-task-card">'+
    '<div class="add-task-inline">'+
      '<input type="text" placeholder="What action advances your goal today?" id="quick-add-input" onkeydown="if(event.key===\'Enter\')quickAddTask()">'+
      '<button class="btn btn-primary" onclick="quickAddTask()"><i data-lucide="plus"></i> Quick Add (+20 XP)</button>'+
    '</div>'+
    '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
      '<select id="quick-add-goal" style="padding:6px 10px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg-surface2);color:var(--text);font-size:12px;outline:none">'+goalOptions+'</select>'+
      '<input type="time" id="quick-add-time" title="Start Time" style="padding:6px 10px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg-surface2);color:var(--text);font-size:12px;outline:none">'+
      '<input type="date" id="quick-add-date" value="'+qDate+'" min="'+today()+'" onchange="state.selectedDate=this.value" style="padding:6px 10px;border-radius:var(--radius-xs);border:1px solid var(--border);background:var(--bg-surface2);color:var(--text);font-size:12px;outline:none">'+
      '<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--frog);cursor:pointer"><input type="checkbox" id="quick-add-frog" style="accent-color:var(--frog)"> Mark Priority (+50 XP)</label>'+
    '</div>'+
  '</div>';

  // 4. Task Cards List
  html+='<div class="task-list" id="today-task-list">';
  if(tasks.length===0){
    html+='<div class="empty-state"><i data-lucide="clipboard-list"></i><h3>No tasks found</h3><p>Add a quick task above or select a different goal filter.</p></div>';
  }else{
    tasks.forEach(function(t){html+=renderTaskCard(t)});
  }
  html+='</div>';
  return html;
}

// ---- ACTIONS ----
function setActiveGoal(goalId){
  state.activeGoalId = goalId;
  pageRender();
}

function promptNewGoal(){
  var title = prompt("Enter new Goal title (e.g., 'Master Python', 'Fitness Goal'):");
  if(!title||!title.trim()) return;
  var colors = ['#6366F1', '#10B981', '#F59E0B', '#EF4444', '#EC4899', '#8B5CF6'];
  var randomColor = colors[Math.floor(Math.random()*colors.length)];
  addGoal(title, randomColor);
}

function quickAddTask(){
  var input=document.getElementById('quick-add-input');
  if(!input||!input.value.trim())return;
  
  var dateInput=document.getElementById('quick-add-date');
  var goalInput=document.getElementById('quick-add-goal');
  var timeInput=document.getElementById('quick-add-time');
  var frogInput=document.getElementById('quick-add-frog');

  var dueDate=dateInput&&dateInput.value?dateInput.value:today();
  if(dueDate<today()){toast('Cannot schedule tasks in the past','error');return}
  
  var startTime=timeInput&&timeInput.value?timeInput.value:null;
  if(isTimeInPast(dueDate, startTime)){
    toast('Cannot schedule a time in the past for today','error');
    return;
  }

  var isFrog = frogInput ? frogInput.checked : false;
  if(isFrog) state.tasks.forEach(function(x){x.eatTheFrog=false});

  state.tasks.push({
    id:genId(),
    title:input.value.trim(),
    goalId:goalInput?goalInput.value||null:state.activeGoalId,
    description:'',
    completed:false,
    createdAt:new Date().toISOString(),
    dueDate:dueDate,
    startTime:startTime,
    endTime:null,
    duration:null,
    eisenhower:null,
    eatTheFrog:isFrog,
    todayTask:dueDate===today(),
    subtasks:[],
    tags:[],
    pomodoroCount:0,
  });

  input.value='';
  if(timeInput) timeInput.value='';
  if(frogInput) frogInput.checked=false;
  
  persistTasks();
  updateStreak();
  pageRender();
  toast('Task added successfully!','success');
}

// ---- PAGE GLUE ----
function pageRender(){
  var content=document.getElementById('content');
  if(content)content.innerHTML=renderTodayView();
  renderQuickStats();
  updateLucide();
  
  var cards=document.querySelectorAll('.task-card[draggable]');
  cards.forEach(function(card){
    card.addEventListener('dragstart',function(e){e.dataTransfer.setData('text/plain',card.dataset.taskId)});
  });
}

// Export functions to window scope
window.quickAddTask=quickAddTask;
window.setActiveGoal=setActiveGoal;
window.promptNewGoal=promptNewGoal;
window.pageRender=pageRender;

document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){lucide.createIcons();commonInit();pageRender()}
  else{setTimeout(function(){commonInit();pageRender()},200)}
});
</script>
</body>
</html>

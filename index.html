<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus System - Today</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i data-lucide="target"></i>
      <span>Focus System</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item active">
        <i data-lucide="sun"></i> <span>Today</span>
        <span class="nav-badge" id="today-count">0</span>
      </a>
      <a href="calendar.html" class="nav-item">
        <i data-lucide="calendar"></i> <span>Calendar</span>
      </a>
      <a href="focus.html" class="nav-item">
        <i data-lucide="timer"></i> <span>Focus</span>
        <span class="nav-badge" id="focus-badge" style="display:none">On</span>
      </a>
      <a href="analytics.html" class="nav-item">
        <i data-lucide="bar-chart-3"></i> <span>Analytics</span>
      </a>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-label">Progress</div>
      <div class="quick-stats">
        <div class="level-badge-container">
          <div class="level-badge-title">
            <i data-lucide="trophy" style="width:14px;height:14px"></i>
            <span id="qs-level">Lvl 1 (0/100 XP)</span>
          </div>
        </div>
        <div class="stat-row"><span>Completed</span><span class="stat-value" id="qs-completed">0/0</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="qs-bar" style="width:0%"></div></div>
        <div class="stat-row" style="margin-top:4px"><span>Streak</span><span class="stat-value" id="qs-streak">0 days</span></div>
        <div class="stat-row"><span>Focus</span><span class="stat-value" id="qs-pomos">0</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-greeting">
        <h2 id="greeting">Good morning</h2>
        <span id="header-date"></span>
      </div>
      <div class="header-search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search tasks..." id="search-input">
      </div>
      <div class="completion-bar">
        <div class="bar-track"><div class="bar-fill" id="header-bar-fill" style="width:0%"></div></div>
        <span class="bar-text" id="header-bar-text">0%</span>
      </div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="task-modal-overlay">
  <div class="modal" id="task-modal"></div>
</div>

<div class="focus-overlay" id="focus-overlay">
  <button class="overlay-exit" id="overlay-exit">Exit Focus Mode</button>
  <div class="overlay-task" id="overlay-task-name">No task selected</div>
  <div class="overlay-timer" id="overlay-timer">25:00</div>
  <div class="overlay-label" id="overlay-label">FOCUS</div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="shared.js"></script>
<script>
function getFilteredTodayTasks(){
  var tasks=getTodayTasks();
  if(state.searchQuery){
    var q=state.searchQuery.toLowerCase();
    tasks=tasks.filter(function(t){return t.title.toLowerCase().indexOf(q)>=0});
  }
  return tasks;
}

function renderGoalOptions(){
  return '<option value="">No goal</option>' + state.goals.map(function(g){
    return '<option value="'+g.id+'"'+(state.activeGoalId===g.id?' selected':'')+'>'+escHtml(g.title)+'</option>';
  }).join('');
}

function shiftDateLocal(offset){
  var d=new Date(today()+'T00:00:00');
  d.setDate(d.getDate()+offset);
  return toDateStr(d);
}

function renderWeekStrip(){
  var html='<section class="week-strip">';
  for(var i=0;i<7;i++){
    var ds=shiftDateLocal(i);
    var d=new Date(ds+'T00:00:00');
    var tasks=getTasksForDate(ds);
    var done=tasks.filter(function(t){return t.completed}).length;
    var total=tasks.length;
    var rate=total?Math.round((done/total)*100):0;
    html+='<button class="week-day '+(ds===today()?'today':'')+'" onclick="window.location.href=\'calendar.html\'">'+
      '<span>'+d.toLocaleDateString('en-US',{weekday:'short'})+'</span>'+
      '<strong>'+d.getDate()+'</strong>'+
      '<em>'+done+'/'+total+'</em>'+
      '<i style="height:'+Math.max(4,rate)+'%"></i>'+
    '</button>';
  }
  html+='</section>';
  return html;
}

function renderTodayView(){
  var tasks=getFilteredTodayTasks();
  var openTasks=tasks.filter(function(t){return !t.completed});
  var doneTasks=tasks.filter(function(t){return t.completed});
  var allToday=state.tasks.filter(function(t){return t.dueDate===today()});
  var done=allToday.filter(function(t){return t.completed}).length;
  var total=allToday.length;
  var rate=total?Math.round((done/total)*100):0;
  var priority=getFrogTask();
  var qDate=state.selectedDate||today();
  var html='';

  html+='<section class="daily-board">'+
    '<div class="daily-hero">'+
      '<div><div class="daily-label">'+fmtDate(today())+'</div><h1>Plan today. Do one thing at a time.</h1></div>'+
      '<div class="daily-score"><strong>'+done+'/'+total+'</strong><span>done</span></div>'+
    '</div>'+
    '<div class="daily-progress"><div style="width:'+rate+'%"></div></div>'+
  '</section>';

  html+=renderWeekStrip();

  html+='<section class="workflow-grid">'+
    '<div class="workflow-panel priority-panel">'+
      '<div class="panel-kicker">Step 1</div>'+
      '<h2>Pick the main task</h2>';
  if(priority){
    html+='<div class="priority-task">'+
      '<div><span>Priority</span><strong>'+escHtml(priority.title)+'</strong></div>'+
      '<div class="priority-actions"><button class="btn btn-primary" onclick="completeTask(\''+priority.id+'\')"><i data-lucide="check"></i> Done</button><button class="btn btn-secondary" onclick="clearFrog()">Clear</button></div>'+
    '</div>';
  }else{
    html+='<p class="panel-note">Choose one task with the bolt button. This keeps today clear and focused.</p>';
  }
  html+='</div>'+
    '<div class="workflow-panel add-panel">'+
      '<div class="panel-kicker">Step 2</div>'+
      '<h2>Add the next action</h2>'+
      '<div class="quick-entry">'+
        '<input type="text" placeholder="Write one clear action..." id="quick-add-input" onkeydown="if(event.key===\'Enter\')quickAddTask()">'+
        '<button class="btn btn-primary" onclick="quickAddTask()"><i data-lucide="plus"></i> Add</button>'+
      '</div>'+
      '<div class="quick-options">'+
        '<select id="quick-add-goal">'+renderGoalOptions()+'</select>'+
        '<input type="time" id="quick-add-time" title="Start time">'+
        '<input type="date" id="quick-add-date" value="'+qDate+'" min="'+today()+'" onchange="state.selectedDate=this.value">'+
        '<label><input type="checkbox" id="quick-add-frog"> Priority</label>'+
      '</div>'+
    '</div>'+
  '</section>';

  html+='<section class="goal-section simple-goals">'+
    '<div class="goal-section-header"><div class="sidebar-label" style="padding:0">View</div>'+
    '<button class="btn btn-sm btn-secondary" onclick="promptNewGoal()"><i data-lucide="plus"></i> Goal</button></div>'+
    '<div class="goal-pills">'+
      '<button class="goal-pill '+(state.activeGoalId===null?'active':'')+'" onclick="setActiveGoal(null)">All</button>';
  state.goals.forEach(function(g){
    var isSel=state.activeGoalId===g.id;
    html+='<span class="goal-manage-pill '+(isSel?'active':'')+'" style="'+(isSel?'background:'+g.color+'22;border-color:'+g.color+';color:'+g.color:'')+'">'+
      '<button class="goal-name-btn" onclick="setActiveGoal(\''+g.id+'\')"><span class="goal-dot" style="background:'+g.color+'"></span>'+escHtml(g.title)+'</button>'+
      '<button class="goal-mini-btn" onclick="editGoalPrompt(\''+g.id+'\')" title="Edit goal"><i data-lucide="pencil"></i></button>'+
      '<button class="goal-mini-btn" onclick="deleteGoalPrompt(\''+g.id+'\')" title="Delete goal"><i data-lucide="trash-2"></i></button>'+
    '</span>';
  });
  html+='</div></section>';

  html+='<section class="task-section"><div class="section-title"><span>Step 3</span><h2>Do these today</h2></div><div class="task-list" id="today-task-list">';
  if(openTasks.length===0){
    html+='<div class="empty-state"><i data-lucide="clipboard-list"></i><h3>Your list is clear</h3><p>Add one action above, or enjoy the clean slate.</p></div>';
  }else{
    openTasks.forEach(function(t){html+=renderTaskCard(t)});
  }
  html+='</div></section>';

  if(doneTasks.length){
    html+='<section class="task-section completed-section"><div class="section-title"><span>Done</span><h2>Completed today</h2></div><div class="task-list">';
    doneTasks.forEach(function(t){html+=renderTaskCard(t)});
    html+='</div></section>';
  }

  return html;
}

function setActiveGoal(goalId){
  state.activeGoalId=goalId;
  pageRender();
}

function promptNewGoal(){
  var title=prompt('New goal name:');
  if(!title||!title.trim())return;
  var colors=['#4F46E5','#059669','#D97706','#DC2626','#DB2777','#7C3AED'];
  addGoal(title, colors[Math.floor(Math.random()*colors.length)]);
}

function editGoalPrompt(goalId){
  var goal=state.goals.find(function(g){return g.id===goalId});
  if(!goal)return;
  var title=prompt('Edit goal name:', goal.title);
  if(!title||!title.trim())return;
  updateGoal(goalId,title,goal.color);
}

function deleteGoalPrompt(goalId){
  var goal=state.goals.find(function(g){return g.id===goalId});
  if(!goal)return;
  if(!confirm('Delete "'+goal.title+'"? Tasks in this goal will become uncategorized.'))return;
  deleteGoal(goalId);
}

function quickAddTask(){
  var input=document.getElementById('quick-add-input');
  if(!input||!input.value.trim())return;
  var dateInput=document.getElementById('quick-add-date');
  var goalInput=document.getElementById('quick-add-goal');
  var timeInput=document.getElementById('quick-add-time');
  var priorityInput=document.getElementById('quick-add-frog');
  var dueDate=dateInput&&dateInput.value?dateInput.value:today();
  var startTime=timeInput&&timeInput.value?timeInput.value:null;
  var isPriority=priorityInput?priorityInput.checked:false;

  if(dueDate<today()){toast('Cannot schedule tasks in the past','error');return}
  if(isTimeInPast(dueDate,startTime)){toast('Cannot schedule a past time for today','error');return}
  if(isPriority)state.tasks.forEach(function(t){t.eatTheFrog=false});

  state.tasks.push({
    id:genId(),
    title:input.value.trim(),
    goalId:goalInput?goalInput.value||null:state.activeGoalId,
    description:'',
    completed:false,
    createdAt:new Date().toISOString(),
    dueDate:dueDate,
    startTime:startTime,
    endTime:null,
    duration:null,
    eisenhower:null,
    eatTheFrog:isPriority,
    todayTask:dueDate===today(),
    subtasks:[],
    tags:[],
    pomodoroCount:0
  });

  persistTasks();
  updateStreak();
  pageRender();
  toast('Task added','success');
}

function pageRender(){
  var content=document.getElementById('content');
  if(content)content.innerHTML=renderTodayView();
  renderQuickStats();
  renderHeader();
  updateLucide();
}

window.quickAddTask=quickAddTask;
window.setActiveGoal=setActiveGoal;
window.promptNewGoal=promptNewGoal;
window.editGoalPrompt=editGoalPrompt;
window.deleteGoalPrompt=deleteGoalPrompt;
window.pageRender=pageRender;

document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){lucide.createIcons();commonInit();pageRender()}
  else{setTimeout(function(){commonInit();pageRender()},200)}
});
</script>
</body>
</html>

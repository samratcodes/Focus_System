<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus System - Analytics</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i data-lucide="target"></i><span>Focus System</span></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><i data-lucide="sun"></i> <span>Today</span><span class="nav-badge" id="today-count">0</span></a>
      <a href="calendar.html" class="nav-item"><i data-lucide="calendar"></i> <span>Calendar</span></a>
      <a href="focus.html" class="nav-item"><i data-lucide="timer"></i> <span>Focus</span><span class="nav-badge" id="focus-badge" style="display:none">On</span></a>
      <a href="analytics.html" class="nav-item active"><i data-lucide="bar-chart-3"></i> <span>Analytics</span></a>
    </nav>
    <div class="sidebar-section">
      <div class="sidebar-label">Progress</div>
      <div class="quick-stats">
        <div class="level-badge-container"><div class="level-badge-title"><i data-lucide="trophy" style="width:14px;height:14px"></i><span id="qs-level">Lvl 1 (0/100 XP)</span></div></div>
        <div class="stat-row"><span>Completed</span><span class="stat-value" id="qs-completed">0/0</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="qs-bar" style="width:0%"></div></div>
        <div class="stat-row" style="margin-top:4px"><span>Streak</span><span class="stat-value" id="qs-streak">0 days</span></div>
        <div class="stat-row"><span>Focus</span><span class="stat-value" id="qs-pomos">0</span></div>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="header">
      <div class="header-greeting"><h2 id="greeting">Good morning</h2><span id="header-date"></span></div>
      <div class="header-search"><i data-lucide="search"></i><input type="text" placeholder="Search tasks..." id="search-input"></div>
      <div class="completion-bar"><div class="bar-track"><div class="bar-fill" id="header-bar-fill" style="width:0%"></div></div><span class="bar-text" id="header-bar-text">0%</span></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="modal-overlay" id="task-modal-overlay"><div class="modal" id="task-modal"></div></div>
<div class="focus-overlay" id="focus-overlay"><button class="overlay-exit" id="overlay-exit">Exit Focus Mode</button><div class="overlay-task" id="overlay-task-name">No task selected</div><div class="overlay-timer" id="overlay-timer">25:00</div><div class="overlay-label" id="overlay-label">FOCUS</div></div>
<div class="toast-container" id="toast-container"></div>
<script src="shared.js"></script>
<script>
state.analyticsPeriod=state.analyticsPeriod||'week';

function dateAdd(days){
  var d=new Date(today()+'T00:00:00');
  d.setDate(d.getDate()+days);
  return toDateStr(d);
}

function periodDays(period){
  var count=period==='day'?1:period==='month'?30:7;
  var days=[];
  for(var i=count-1;i>=0;i--)days.push(dateAdd(-i));
  return days;
}

function getPeriodStats(period){
  var days=periodDays(period);
  var daySet={};
  days.forEach(function(d){daySet[d]=true});
  var tasks=state.tasks.filter(function(t){return daySet[t.dueDate]});
  var done=tasks.filter(function(t){return t.completed});
  var sessions=state.pomoLog.filter(function(l){return daySet[l.date]}).reduce(function(s,l){return s+(l.sessions||1)},0);
  return {days:days,tasks:tasks,done:done,total:tasks.length,rate:tasks.length?Math.round(done.length/tasks.length*100):0,sessions:sessions,minutes:sessions*(state.pomoSettings.work||25)};
}

function renderTrend(days){
  return '<div class="performance-bars">'+days.map(function(ds){
    var tasks=getTasksForDate(ds);
    var done=tasks.filter(function(t){return t.completed}).length;
    var rate=tasks.length?Math.round(done/tasks.length*100):0;
    var h=Math.max(6,rate);
    var label=new Date(ds+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return '<div class="perf-day"><div class="perf-bar"><i style="height:'+h+'%;background:'+(rate>=80?'var(--success)':rate>=40?'var(--primary)':'var(--warning)')+'"></i></div><strong>'+rate+'%</strong><span>'+label+'</span><em>'+done+'/'+tasks.length+'</em></div>';
  }).join('')+'</div>';
}

function renderGoalBreakdown(tasks){
  var rows=state.goals.map(function(g){
    var gt=tasks.filter(function(t){return t.goalId===g.id});
    return {goal:g,total:gt.length,done:gt.filter(function(t){return t.completed}).length};
  }).filter(function(r){return r.total>0});
  var uncategorized=tasks.filter(function(t){return !t.goalId});
  if(uncategorized.length)rows.push({goal:{title:'No goal',color:'var(--text-muted)'},total:uncategorized.length,done:uncategorized.filter(function(t){return t.completed}).length});
  if(!rows.length)return '<div class="empty-state compact-empty">No category data yet.</div>';
  return '<div class="breakdown-list">'+rows.map(function(r){
    var pct=r.total?Math.round(r.done/r.total*100):0;
    return '<div class="breakdown-row"><div><span class="goal-dot" style="background:'+r.goal.color+'"></span><strong>'+escHtml(r.goal.title)+'</strong><small>'+r.done+'/'+r.total+' complete</small></div><div class="mini-track"><i style="width:'+pct+'%;background:'+r.goal.color+'"></i></div><b>'+pct+'%</b></div>';
  }).join('')+'</div>';
}

function renderMatrix(tasks){
  var keys=[['do-first','Do First'],['schedule','Schedule'],['delegate','Delegate'],['eliminate','Eliminate']];
  var open=tasks.filter(function(t){return !t.completed});
  return '<div class="matrix-grid">'+keys.map(function(pair){
    var count=open.filter(function(t){return t.eisenhower===pair[0]}).length;
    return '<div class="matrix-cell"><div class="matrix-count">'+count+'</div><div class="matrix-label">'+pair[1]+'</div></div>';
  }).join('')+'</div>';
}

function renderAnalyticsView(){
  var period=state.analyticsPeriod||'week';
  var stats=getPeriodStats(period);
  var bestDay=stats.days.map(function(ds){
    var t=getTasksForDate(ds), d=t.filter(function(x){return x.completed}).length;
    return {date:ds,done:d,total:t.length};
  }).sort(function(a,b){return b.done-a.done})[0]||{date:today(),done:0,total:0};
  var avg=stats.days.length?Math.round(stats.done.length/stats.days.length*10)/10:0;
  var periodLabel=period==='day'?'Today':period==='week'?'Last 7 days':'Last 30 days';

  return '<section class="analytics-head">'+
    '<div><div class="daily-label">'+periodLabel+'</div><h1>Performance dashboard</h1></div>'+
    '<div class="period-tabs">'+
      '<button class="'+(period==='day'?'active':'')+'" onclick="setAnalyticsPeriod(\'day\')">Day</button>'+
      '<button class="'+(period==='week'?'active':'')+'" onclick="setAnalyticsPeriod(\'week\')">Week</button>'+
      '<button class="'+(period==='month'?'active':'')+'" onclick="setAnalyticsPeriod(\'month\')">Month</button>'+
    '</div>'+
  '</section>'+
  '<section class="analytics-summary-grid">'+
    '<div class="metric-card"><span>Completion</span><strong>'+stats.rate+'%</strong><em>'+stats.done.length+' of '+stats.total+' tasks</em></div>'+
    '<div class="metric-card"><span>Daily average</span><strong>'+avg+'</strong><em>completed tasks</em></div>'+
    '<div class="metric-card"><span>Focus time</span><strong>'+stats.minutes+'m</strong><em>'+stats.sessions+' sessions</em></div>'+
    '<div class="metric-card"><span>Best day</span><strong>'+bestDay.done+'</strong><em>'+fmtDateShort(bestDay.date)+'</em></div>'+
  '</section>'+
  '<section class="analytics-card full-width"><h4>Day by day results</h4>'+renderTrend(stats.days)+'</section>'+
  '<section class="analytics-two-col">'+
    '<div class="analytics-card"><h4>By goal/category</h4>'+renderGoalBreakdown(stats.tasks)+'</div>'+
    '<div class="analytics-card"><h4>Task type</h4>'+renderMatrix(stats.tasks)+'</div>'+
  '</section>';
}

function setAnalyticsPeriod(period){
  state.analyticsPeriod=period;
  pageRender();
}

function pageRender(){
  var content=document.getElementById('content');
  if(content)content.innerHTML=renderAnalyticsView();
  renderQuickStats();
  renderHeader();
  updateLucide();
}

window.setAnalyticsPeriod=setAnalyticsPeriod;
window.pageRender=pageRender;

document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){lucide.createIcons();commonInit();pageRender()}
  else{setTimeout(function(){commonInit();pageRender()},200)}
});
</script>
</body>
</html>

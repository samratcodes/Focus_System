<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus System — Analytics</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i data-lucide="target"></i>
      <span>Focus System</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item">
        <i data-lucide="sun"></i> <span>Today</span>
        <span class="nav-badge" id="today-count">0</span>
      </a>
      <a href="calendar.html" class="nav-item">
        <i data-lucide="calendar"></i> <span>Calendar</span>
      </a>
      <a href="focus.html" class="nav-item">
        <i data-lucide="timer"></i> <span>Focus</span>
        <span class="nav-badge" id="focus-badge" style="display:none">●</span>
      </a>
      <a href="analytics.html" class="nav-item active">
        <i data-lucide="bar-chart-3"></i> <span>Analytics</span>
      </a>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-label">Player Stats</div>
      <div class="quick-stats">
        <div class="level-badge-container">
          <div class="level-badge-title">
            <i data-lucide="trophy" style="width:14px;height:14px"></i>
            <span id="qs-level">Lvl 1 (0/100 XP)</span>
          </div>
        </div>
        <div class="stat-row"><span>Completed</span><span class="stat-value" id="qs-completed">0/0</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="qs-bar" style="width:0%"></div></div>
        <div class="stat-row" style="margin-top:4px"><span>Streak</span><span class="stat-value" id="qs-streak">0 days</span></div>
        <div class="stat-row"><span>Today's Focus</span><span class="stat-value" id="qs-pomos">0 sessions</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-greeting">
        <h2 id="greeting">Good morning</h2>
        <span id="header-date"></span>
      </div>
      <div class="header-search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search tasks..." id="search-input">
      </div>
      <div class="completion-bar">
        <div class="bar-track"><div class="bar-fill" id="header-bar-fill" style="width:0%"></div></div>
        <span class="bar-text" id="header-bar-text">0%</span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="task-modal-overlay">
  <div class="modal" id="task-modal"></div>
</div>

<div class="focus-overlay" id="focus-overlay">
  <button class="overlay-exit" id="overlay-exit">Exit Focus Mode</button>
  <div class="overlay-task" id="overlay-task-name">No task selected</div>
  <div class="overlay-timer" id="overlay-timer">25:00</div>
  <div class="overlay-label" id="overlay-label">FOCUS</div>
  <div class="overlay-ambient">
    <div class="ambient-dot"></div><div class="ambient-dot"></div><div class="ambient-dot"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="shared.js"></script>
<script>
// ============================================================
// SIMPLIFIED ANALYTICS VIEW
// ============================================================

function renderAnalyticsView(){
  var streak = getStreakCount();
  var todayTasks = getTodayTasks();
  var todayDone = todayTasks.filter(function(t){return t.completed}).length;
  var todayTotal = todayTasks.length;
  var todayRate = todayTotal ? Math.round((todayDone / todayTotal) * 100) : 0;
  var todayPomos = state.pomoLog.filter(function(l){return l.date===today()}).reduce(function(s,l){return s+(l.sessions||1)},0);
  var focusMinToday = todayPomos * (state.pomoSettings.work || 25);
  var allTotal = state.tasks.length;
  var allDone = state.tasks.filter(function(t){return t.completed}).length;
  var totalPomos = state.pomoLog.reduce(function(s,l){return s + (l.sessions || 1)}, 0);
  var openTasks = state.tasks.filter(function(t){return !t.completed});
  var eisCount = function(key){ return openTasks.filter(function(t){return t.eisenhower===key}).length; };
  var doFirst = eisCount('do-first'), schedule = eisCount('schedule'), delegate = eisCount('delegate'), eliminate = eisCount('eliminate');

  // 7-Day Completion Rate
  var weekDays = [];
  for(var i = 6; i >= 0; i--){
    var d = new Date();
    d.setDate(d.getDate() - i);
    var ds = toDateStr(d);
    var dayTasks = getTasksForDate(ds);
    weekDays.push({
      label: d.toLocaleDateString('en-US', { weekday: 'short' }),
      rate: dayTasks.length ? Math.round((dayTasks.filter(function(t){return t.completed}).length / dayTasks.length) * 100) : 0
    });
  }

  var html = '<div class="analytics-grid">'+

    // 1. Today summary (scoped to today only)
    '<div class="analytics-card full-width">'+
      '<h4>Today — '+fmtDate(today())+'</h4>'+
      '<div class="stat-strip">'+
        '<div class="stat-tile"><div class="tile-value" style="color:var(--primary)">'+todayTotal+'</div><div class="tile-label">Total Tasks</div></div>'+
        '<div class="stat-tile"><div class="tile-value" style="color:var(--success)">'+todayDone+'</div><div class="tile-label">Completed</div></div>'+
        '<div class="stat-tile"><div class="tile-value">'+todayRate+'%</div><div class="tile-label">Completion</div></div>'+
        '<div class="stat-tile"><div class="tile-value" style="color:var(--frog)">'+todayPomos+'</div><div class="tile-label">Focus Sessions</div></div>'+
      '</div>'+
      '<div class="stat-bar" style="height:8px;margin-top:14px"><div class="stat-bar-fill" style="width:'+todayRate+'%;background:var(--success)"></div></div>'+
    '</div>'+

    // 2. Overview highlights
    '<div class="analytics-card" style="display:flex;align-items:center;gap:16px;padding:20px">'+
      '<div style="background:var(--frog-bg);color:var(--frog);padding:12px;border-radius:var(--radius-sm)"><i data-lucide="flame" style="width:26px;height:26px"></i></div>'+
      '<div><div style="font-size:26px;font-weight:800;line-height:1.1">'+streak+' Days</div><div style="font-size:12px;color:var(--text-muted);font-weight:600">Streak</div></div>'+
    '</div>'+

    '<div class="analytics-card" style="display:flex;align-items:center;gap:16px;padding:20px">'+
      '<div style="background:var(--success-bg);color:var(--success);padding:12px;border-radius:var(--radius-sm)"><i data-lucide="check-circle-2" style="width:26px;height:26px"></i></div>'+
      '<div><div style="font-size:26px;font-weight:800;line-height:1.1">'+allDone+'/'+allTotal+'</div><div style="font-size:12px;color:var(--text-muted);font-weight:600">Tasks Completed (all time)</div></div>'+
    '</div>'+

    '<div class="analytics-card" style="display:flex;align-items:center;gap:16px;padding:20px">'+
      '<div style="background:var(--primary-bg);color:var(--primary);padding:12px;border-radius:var(--radius-sm)"><i data-lucide="timer" style="width:26px;height:26px"></i></div>'+
      '<div><div style="font-size:26px;font-weight:800;line-height:1.1">'+totalPomos+'</div><div style="font-size:12px;color:var(--text-muted);font-weight:600">Focus Sessions (all time)</div></div>'+
    '</div>'+

    '<div class="analytics-card" style="display:flex;align-items:center;gap:16px;padding:20px">'+
      '<div style="background:var(--info-bg);color:var(--info);padding:12px;border-radius:var(--radius-sm)"><i data-lucide="clock" style="width:26px;height:26px"></i></div>'+
      '<div><div style="font-size:26px;font-weight:800;line-height:1.1">'+focusMinToday+'m</div><div style="font-size:12px;color:var(--text-muted);font-weight:600">Focus Time Today</div></div>'+
    '</div>'+

    // 3. Eisenhower priority matrix
    '<div class="analytics-card full-width">'+
      '<h4>Priority Matrix (Open Tasks)</h4>'+
      '<div class="matrix-grid">'+
        '<div class="matrix-cell"><div class="matrix-count">'+doFirst+'</div><div class="matrix-label">Do First</div></div>'+
        '<div class="matrix-cell"><div class="matrix-count">'+schedule+'</div><div class="matrix-label">Schedule</div></div>'+
        '<div class="matrix-cell"><div class="matrix-count">'+delegate+'</div><div class="matrix-label">Delegate</div></div>'+
        '<div class="matrix-cell"><div class="matrix-count">'+eliminate+'</div><div class="matrix-label">Eliminate</div></div>'+
      '</div>'+
    '</div>'+

    // 2. Goal Progress Overview
    (state.goals && state.goals.length > 0 ?
    '<div class="analytics-card full-width">'+
      '<h4>Goal Progress</h4>'+
      '<div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">'+
        state.goals.map(function(g){
          var pct = (typeof getGoalProgress === 'function') ? getGoalProgress(g.id) : 0;
          var tasks = state.tasks.filter(function(t){ return t.goalId === g.id; });
          var done = tasks.filter(function(t){ return t.completed; }).length;
          return '<div style="background:var(--bg-surface2);padding:12px 16px;border-radius:var(--radius-sm)">'+
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'+
              '<span style="font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:'+g.color+'"></span>'+escHtml(g.title)+'</span>'+
              '<span style="font-size:12px;font-weight:800;color:'+g.color+'">'+done+'/'+tasks.length+' ('+pct+'%)</span>'+
            '</div>'+
            '<div class="stat-bar" style="height:6px"><div class="stat-bar-fill" style="width:'+pct+'%;background:'+g.color+'"></div></div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>' : '')+

    // 3. Simple Weekly Trend
    '<div class="analytics-card full-width">'+
      '<h4>Last 7 Days Activity</h4>'+
      '<div class="completion-chart" style="margin-top:12px">'+
        weekDays.map(function(dd){
          var h = Math.max(6, dd.rate);
          return '<div class="chart-bar-group"><div class="chart-bar" style="height:'+h+'%;background:'+(dd.rate===100?'var(--success)':'var(--primary)')+'"></div><span class="chart-bar-label">'+dd.label+'</span></div>';
        }).join('')+
      '</div>'+
    '</div>'+

  '</div>';
  return html;
}

// ---- PAGE GLUE ----
function pageRender(){
  var content=document.getElementById('content');
  if(content)content.innerHTML=renderAnalyticsView();
  renderQuickStats();
  updateLucide();
}

window.pageRender=pageRender;

document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){lucide.createIcons();commonInit();pageRender()}
  else{setTimeout(function(){commonInit();pageRender()},200)}
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus System — Focus</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i data-lucide="target"></i>
      <span>Focus System</span>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item">
        <i data-lucide="sun"></i> <span>Today</span>
        <span class="nav-badge" id="today-count">0</span>
      </a>
      <a href="calendar.html" class="nav-item">
        <i data-lucide="calendar"></i> <span>Calendar</span>
      </a>
      <a href="focus.html" class="nav-item active">
        <i data-lucide="timer"></i> <span>Focus</span>
        <span class="nav-badge" id="focus-badge" style="display:none">●</span>
      </a>
      <a href="analytics.html" class="nav-item">
        <i data-lucide="bar-chart-3"></i> <span>Analytics</span>
      </a>
    </nav>

    <div class="sidebar-section">
      <div class="sidebar-label">Player Stats</div>
      <div class="quick-stats">
        <div class="level-badge-container">
          <div class="level-badge-title">
            <i data-lucide="trophy" style="width:14px;height:14px"></i>
            <span id="qs-level">Lvl 1 (0/100 XP)</span>
          </div>
        </div>
        <div class="stat-row"><span>Completed</span><span class="stat-value" id="qs-completed">0/0</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="qs-bar" style="width:0%"></div></div>
        <div class="stat-row" style="margin-top:4px"><span>Streak</span><span class="stat-value" id="qs-streak">0 days</span></div>
        <div class="stat-row"><span>Today's Focus</span><span class="stat-value" id="qs-pomos">0 sessions</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-greeting">
        <h2 id="greeting">Good morning</h2>
        <span id="header-date"></span>
      </div>
      <div class="header-search">
        <i data-lucide="search"></i>
        <input type="text" placeholder="Search tasks..." id="search-input">
      </div>
      <div class="completion-bar">
        <div class="bar-track"><div class="bar-fill" id="header-bar-fill" style="width:0%"></div></div>
        <span class="bar-text" id="header-bar-text">0%</span>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="task-modal-overlay">
  <div class="modal" id="task-modal"></div>
</div>

<div class="focus-overlay" id="focus-overlay">
  <button class="overlay-exit" id="overlay-exit">Exit Focus Mode</button>
  <div class="overlay-task" id="overlay-task-name">No task selected</div>
  <div class="overlay-timer" id="overlay-timer">25:00</div>
  <div class="overlay-label" id="overlay-label">FOCUS</div>
  <div class="overlay-ambient">
    <div class="ambient-dot"></div><div class="ambient-dot"></div><div class="ambient-dot"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="shared.js"></script>
<script>
// ============================================================
// FOCUS VIEW — Gamified Pomodoro Engine
// ============================================================

function renderFocusView(){
  var tasks=getTodayTasks().filter(function(t){return !t.completed});
  var mins=Math.floor(pomoState.secondsLeft/60);
  var secs=pomoState.secondsLeft%60;
  var timeStr=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  var progress=pomoState.totalSeconds>0?((pomoState.totalSeconds-pomoState.secondsLeft)/pomoState.totalSeconds):0;
  var circumference=2*Math.PI*115;
  var offset=circumference*(1-progress);

  var taskOptions = tasks.map(function(t){
    var g = t.goalId ? state.goals.find(function(g){return g.id===t.goalId}) : null;
    var goalName = g ? ' [' + g.title + ']' : '';
    return '<option value="'+t.id+'"'+(pomoState.attachedTaskId===t.id?' selected':'')+'>'+escHtml(t.title)+goalName+'</option>';
  }).join('');

  var html='<div class="focus-layout">'+
    '<div class="focus-timer-area">'+
      '<div class="timer-ring">'+
        '<svg width="260" height="260" viewBox="0 0 260 260">'+
          '<circle class="ring-bg" cx="130" cy="130" r="115"></circle>'+
          '<circle class="ring-progress'+(pomoState.mode!=='work'?' break':'')+'" cx="130" cy="130" r="115" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'"></circle>'+
        '</svg>'+
        '<div class="timer-time" id="timer-display">'+timeStr+'</div>'+
        '<div class="timer-label" style="color:'+(pomoState.mode==='work'?'var(--primary)':'var(--success)')+'">'+(pomoState.mode==='work'?'FOCUS':pomoState.mode==='shortBreak'?'SHORT BREAK':'LONG BREAK')+'</div>'+
      '</div>'+
      '<div class="timer-controls" id="timer-controls">'+
        (pomoState.running?'<button class="btn btn-secondary" id="btn-pause-pomo" onclick="pausePomo()"><i data-lucide="pause"></i> Pause</button>':'<button class="btn btn-primary" id="btn-start-pomo" onclick="startPomo()"><i data-lucide="play"></i> Start (+25 XP)</button>')+
        '<button class="btn btn-secondary" onclick="resetPomo();pageRender()"><i data-lucide="rotate-ccw"></i> Reset</button>'+
      '</div>'+
      '<div class="timer-sessions">Sessions completed: <span>'+pomoState.sessionCount+'</span></div>'+
      '<button class="btn btn-secondary" onclick="enterFocusOverlay()" style="margin-top:8px"><i data-lucide="maximize-2"></i> Enter Fullscreen Focus</button>'+
    '</div>'+
    '<div class="focus-sidebar">'+
      '<div class="focus-card"><h4>Attach Task (+25 XP)</h4><select id="focus-task-select" onchange="attachTaskToPomo(this.value)"><option value="">— None —</option>'+taskOptions+'</select></div>'+
      '<div class="focus-card"><h4>Timer Settings (min)</h4>'+
        '<div class="settings-row"><label>Work</label><input type="number" value="'+state.pomoSettings.work+'" min="1" max="120" id="setting-work" onchange="updatePomoSetting(\'work\',this.value)"></div>'+
        '<div class="settings-row"><label>Short Break</label><input type="number" value="'+state.pomoSettings.shortBreak+'" min="1" max="60" id="setting-short" onchange="updatePomoSetting(\'shortBreak\',this.value)"></div>'+
        '<div class="settings-row"><label>Long Break</label><input type="number" value="'+state.pomoSettings.longBreak+'" min="1" max="60" id="setting-long" onchange="updatePomoSetting(\'longBreak\',this.value)"></div>'+
        '<div class="settings-row"><label>Interval</label><input type="number" value="'+state.pomoSettings.longBreakInterval+'" min="1" max="10" id="setting-interval" onchange="updatePomoSetting(\'longBreakInterval\',this.value)"></div>'+
      '</div>'+
      '<div class="focus-card"><h4>Today\'s Sessions</h4>'+
        '<div class="focus-log">'+(state.pomoLog.filter(function(l){return l.date===today()}).length===0?'<div style="font-size:12px;color:var(--text-muted);text-align:center;padding:10px">No sessions completed today</div>':'')+
        state.pomoLog.filter(function(l){return l.date===today()}).slice(-10).reverse().map(function(l){
          var t=l.taskId?state.tasks.find(function(t){return t.id===l.taskId}):null;
          return '<div class="focus-log-entry"><span>'+(t?escHtml(t.title.slice(0,25)):'Untracked Session')+'</span><span>'+((l.sessions||1))+'</span></div>';
        }).join('')+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';
  return html;
}

function renderPomoDisplay(){
  var timerDisplay=document.getElementById('timer-display');
  if(!timerDisplay)return;
  var mins=Math.floor(pomoState.secondsLeft/60);
  var secs=pomoState.secondsLeft%60;
  timerDisplay.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');

  var circle=document.querySelector('.ring-progress');
  if(circle){
    var progress=pomoState.totalSeconds>0?((pomoState.totalSeconds-pomoState.secondsLeft)/pomoState.totalSeconds):0;
    var circumference=2*Math.PI*115;
    circle.style.strokeDashoffset=circumference*(1-progress);
    circle.setAttribute('stroke-dashoffset',circumference*(1-progress));
    if(pomoState.mode!=='work')circle.classList.add('break');else circle.classList.remove('break');
  }

  var label=document.querySelector('.timer-label');
  if(label){
    label.textContent=pomoState.mode==='work'?'FOCUS':pomoState.mode==='shortBreak'?'SHORT BREAK':'LONG BREAK';
    label.style.color=pomoState.mode==='work'?'var(--primary)':'var(--success)';
  }

  var sessions=document.querySelector('.timer-sessions span');
  if(sessions)sessions.textContent=pomoState.sessionCount;

  var controls=document.getElementById('timer-controls');
  if(controls){
    if(pomoState.running){
      controls.innerHTML='<button class="btn btn-secondary" id="btn-pause-pomo" onclick="pausePomo()"><i data-lucide="pause"></i> Pause</button><button class="btn btn-secondary" onclick="resetPomo();pageRender()"><i data-lucide="rotate-ccw"></i> Reset</button>';
    }else{
      controls.innerHTML='<button class="btn btn-primary" id="btn-start-pomo" onclick="startPomo()"><i data-lucide="play"></i> Start (+25 XP)</button><button class="btn btn-secondary" onclick="resetPomo();pageRender()"><i data-lucide="rotate-ccw"></i> Reset</button>';
    }
    updateLucide();
  }
  renderQuickStats();
}

function enterFocusOverlayLocal(){
  var overlay=document.getElementById('focus-overlay');
  if(!overlay)return;
  overlay.classList.add('active');
  var t=pomoState.attachedTaskId?state.tasks.find(function(t){return t.id===pomoState.attachedTaskId}):null;
  var ot=document.getElementById('overlay-task-name');
  if(ot)ot.textContent=t?t.title:'Deep Work Focus Session';
  renderOverlayTimer();
  var ol=document.getElementById('overlay-label');
  if(ol)ol.textContent=pomoState.mode==='work'?'FOCUS':pomoState.mode==='shortBreak'?'SHORT BREAK':'LONG BREAK';
}

function renderOverlayTimerLocal(){
  var overlay=document.getElementById('focus-overlay');
  if(!overlay||!overlay.classList.contains('active'))return;
  var mins=Math.floor(pomoState.secondsLeft/60);
  var secs=pomoState.secondsLeft%60;
  var ot=document.getElementById('overlay-timer');
  if(ot)ot.textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  var ol=document.getElementById('overlay-label');
  if(ol)ol.textContent=pomoState.mode==='work'?'FOCUS':pomoState.mode==='shortBreak'?'SHORT BREAK':'LONG BREAK';
}

function attachTaskToPomo(taskId){pomoState.attachedTaskId=taskId||null}

function updatePomoSetting(key,val){
  var v=parseInt(val);
  if(isNaN(v)||v<1)return;
  state.pomoSettings[key]=v;
  save(STORAGE_KEYS.pomoSettings,state.pomoSettings);
  if(!pomoState.running){
    if(key==='work'&&pomoState.mode==='work'){pomoState.secondsLeft=v*60;pomoState.totalSeconds=v*60}
    if(key==='shortBreak'&&pomoState.mode==='shortBreak'){pomoState.secondsLeft=v*60;pomoState.totalSeconds=v*60}
    if(key==='longBreak'&&pomoState.mode==='longBreak'){pomoState.secondsLeft=v*60;pomoState.totalSeconds=v*60}
    renderPomoDisplay();
  }
}

function pageRender(){
  var content=document.getElementById('content');
  if(content)content.innerHTML=renderFocusView();
  renderQuickStats();
  updateLucide();
}

window.renderPomoDisplay=renderPomoDisplay;
window.renderOverlayTimer=renderOverlayTimerLocal;
window.enterFocusOverlay=enterFocusOverlayLocal;
window.attachTaskToPomo=attachTaskToPomo;
window.updatePomoSetting=updatePomoSetting;
window.pageRender=pageRender;

document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){lucide.createIcons();commonInit();pageRender()}
  else{setTimeout(function(){commonInit();pageRender()},200)}
});
</script>
</body>
</html>

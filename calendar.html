<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus System - Calendar</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><i data-lucide="target"></i><span>Focus System</span></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="nav-item"><i data-lucide="sun"></i> <span>Today</span><span class="nav-badge" id="today-count">0</span></a>
      <a href="calendar.html" class="nav-item active"><i data-lucide="calendar"></i> <span>Calendar</span></a>
      <a href="focus.html" class="nav-item"><i data-lucide="timer"></i> <span>Focus</span><span class="nav-badge" id="focus-badge" style="display:none">On</span></a>
      <a href="analytics.html" class="nav-item"><i data-lucide="bar-chart-3"></i> <span>Analytics</span></a>
    </nav>
    <div class="sidebar-section">
      <div class="sidebar-label">Progress</div>
      <div class="quick-stats">
        <div class="level-badge-container"><div class="level-badge-title"><i data-lucide="trophy" style="width:14px;height:14px"></i><span id="qs-level">Lvl 1 (0/100 XP)</span></div></div>
        <div class="stat-row"><span>Completed</span><span class="stat-value" id="qs-completed">0/0</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="qs-bar" style="width:0%"></div></div>
        <div class="stat-row" style="margin-top:4px"><span>Streak</span><span class="stat-value" id="qs-streak">0 days</span></div>
        <div class="stat-row"><span>Focus</span><span class="stat-value" id="qs-pomos">0</span></div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-greeting"><h2 id="greeting">Good morning</h2><span id="header-date"></span></div>
      <div class="header-search"><i data-lucide="search"></i><input type="text" placeholder="Search tasks..." id="search-input"></div>
      <div class="completion-bar"><div class="bar-track"><div class="bar-fill" id="header-bar-fill" style="width:0%"></div></div><span class="bar-text" id="header-bar-text">0%</span></div>
    </header>
    <div class="content calendar-content" id="content"></div>
  </main>
</div>

<div class="modal-overlay" id="task-modal-overlay"><div class="modal" id="task-modal"></div></div>
<div class="focus-overlay" id="focus-overlay"><button class="overlay-exit" id="overlay-exit">Exit Focus Mode</button><div class="overlay-task" id="overlay-task-name">No task selected</div><div class="overlay-timer" id="overlay-timer">25:00</div><div class="overlay-label" id="overlay-label">FOCUS</div></div>
<div class="toast-container" id="toast-container"></div>

<script src="shared.js"></script>
<script>
function monthName(month){
  return ['January','February','March','April','May','June','July','August','September','October','November','December'][month];
}

function syncCalendarToDate(dateStr){
  var d=new Date(dateStr+'T00:00:00');
  state.calendarMonth=d.getMonth();
  state.calendarYear=d.getFullYear();
}

function renderCalendarView(){
  if(!state.selectedDate)state.selectedDate=today();
  var cm=state.calendarMonth;
  var cy=state.calendarYear;
  var title=monthName(cm)+' '+cy;
  var selectedTasks=getTasksForDate(state.selectedDate);
  var activeTasks=selectedTasks.filter(function(t){return !t.completed});
  var completedTasks=selectedTasks.filter(function(t){return t.completed});
  var selectedIsPast=state.selectedDate<today();
  var done=completedTasks.length;
  var total=selectedTasks.length;
  var rate=total?Math.round(done/total*100):0;

  return '<section class="calendar-page">'+
    '<div class="calendar-first">'+
      '<div class="calendar-page-head">'+
        '<div><div class="daily-label">Calendar</div><h1>'+title+'</h1></div>'+
        '<div class="calendar-actions">'+
          '<button class="btn btn-secondary" onclick="navMonth(-1)" title="Previous month"><i data-lucide="chevron-left"></i></button>'+
          '<button class="btn btn-secondary" onclick="selectDate(\''+today()+'\')">Today</button>'+
          '<button class="btn btn-secondary" onclick="navMonth(1)" title="Next month"><i data-lucide="chevron-right"></i></button>'+
        '</div>'+
      '</div>'+
      renderMonthGrid(cm,cy)+
    '</div>'+
    '<aside class="selected-day-panel">'+
      '<div class="selected-day-head">'+
        '<div><div class="daily-label">Selected date</div><h2>'+fmtDate(state.selectedDate)+'</h2></div>'+
        '<div class="daily-score small"><strong>'+done+'/'+total+'</strong><span>done</span></div>'+
      '</div>'+
      '<div class="daily-progress"><div style="width:'+rate+'%"></div></div>'+
      (selectedIsPast?renderPastNote():renderDayComposer())+
      '<div class="section-title"><span>Tasks</span><h2>'+activeTasks.length+' active</h2></div>'+
      renderTaskList(activeTasks, selectedTasks.length===0)+
      (completedTasks.length?'<div class="section-title completed-title"><span>Done</span><h2>'+completedTasks.length+' completed</h2></div><div class="task-list">'+completedTasks.map(renderTaskCard).join('')+'</div>':'')+
    '</aside>'+
  '</section>';
}

function renderPastNote(){
  return '<div class="calendar-note"><i data-lucide="lock"></i><span>Past dates are read-only. Pick today or a future date to add tasks.</span></div>';
}

function renderDayComposer(){
  var goalOptions='<option value="">No goal</option>'+state.goals.map(function(g){return '<option value="'+g.id+'">'+escHtml(g.title)+'</option>';}).join('');
  return '<div class="calendar-composer">'+
    '<input type="text" id="cal-add-input" placeholder="Add a task for '+fmtDateShort(state.selectedDate)+'..." onkeydown="if(event.key===\'Enter\')calAddTask()">'+
    '<div class="calendar-composer-options">'+
      '<select id="cal-add-goal">'+goalOptions+'</select>'+
      '<input type="time" id="cal-add-time">'+
      '<label><input type="checkbox" id="cal-add-priority"> Priority</label>'+
      '<button class="btn btn-primary" onclick="calAddTask()"><i data-lucide="plus"></i> Add</button>'+
    '</div>'+
  '</div>';
}

function renderTaskList(tasks, emptyDay){
  if(tasks.length)return '<div class="task-list">'+tasks.map(renderTaskCard).join('')+'</div>';
  return '<div class="empty-state compact-empty"><i data-lucide="calendar-plus"></i><h3>'+(emptyDay?'Nothing planned':'All clear')+'</h3><p>'+(emptyDay?'Add one task above for this date.':'Every task for this date is completed.')+'</p></div>';
}

function renderMonthGrid(cm,cy){
  var names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var firstDay=new Date(cy,cm,1).getDay();
  var daysInMonth=new Date(cy,cm+1,0).getDate();
  var prevMonthDays=new Date(cy,cm,0).getDate();
  var html='<div class="calendar-grid simple-calendar-grid">';
  names.forEach(function(n){html+='<div class="day-header">'+n+'</div>';});

  for(var i=firstDay-1;i>=0;i--){
    var day=prevMonthDays-i;
    var prevMonth=cm===0?11:cm-1;
    var prevYear=cm===0?cy-1:cy;
    html+=renderDayCell(day,toDateStr(new Date(prevYear,prevMonth,day)),true);
  }
  for(var d=1;d<=daysInMonth;d++){
    html+=renderDayCell(d,toDateStr(new Date(cy,cm,d)),false);
  }
  var cells=firstDay+daysInMonth;
  var nextDay=1;
  while(cells<42){
    var nextMonth=cm===11?0:cm+1;
    var nextYear=cm===11?cy+1:cy;
    html+=renderDayCell(nextDay,toDateStr(new Date(nextYear,nextMonth,nextDay)),true);
    nextDay++;
    cells++;
  }
  html+='</div>';
  return html;
}

function renderDayCell(day,dateStr,otherMonth){
  var tasks=getTasksForDate(dateStr);
  var done=tasks.filter(function(t){return t.completed}).length;
  var priority=tasks.some(function(t){return t.eatTheFrog&&!t.completed});
  var cls=['day-cell'];
  if(otherMonth)cls.push('other-month');
  if(dateStr===today())cls.push('today');
  if(dateStr===state.selectedDate)cls.push('selected');
  if(dateStr<today()&&!otherMonth)cls.push('past-day');
  var dots=tasks.slice(0,4).map(function(t){return '<span class="day-dot '+(t.completed?'completed':t.eatTheFrog?'frog':'normal')+'"></span>';}).join('');
  return '<button class="'+cls.join(' ')+'" onclick="selectDate(\''+dateStr+'\')">'+
    '<span class="day-num">'+day+'</span>'+
    (tasks.length?'<span class="day-count">'+tasks.length+'</span>':'')+
    (priority?'<span class="priority-corner"><i data-lucide="zap"></i></span>':'')+
    '<span class="day-dots">'+dots+'</span>'+
    (tasks.length?'<span class="day-summary">'+done+'/'+tasks.length+'</span>':'')+
  '</button>';
}

function selectDate(dateStr){
  state.selectedDate=dateStr;
  syncCalendarToDate(dateStr);
  pageRender();
}

function navMonth(dir){
  state.calendarMonth+=dir;
  if(state.calendarMonth<0){state.calendarMonth=11;state.calendarYear--}
  if(state.calendarMonth>11){state.calendarMonth=0;state.calendarYear++}
  pageRender();
}

function calAddTask(){
  var input=document.getElementById('cal-add-input');
  if(!input||!input.value.trim())return;
  if(state.selectedDate<today()){toast('Cannot add tasks to past dates','error');return}
  var goal=document.getElementById('cal-add-goal');
  var time=document.getElementById('cal-add-time');
  var priority=document.getElementById('cal-add-priority');
  var startTime=time&&time.value?time.value:null;
  if(isTimeInPast(state.selectedDate,startTime)){toast('Cannot schedule a past time for today','error');return}
  var isPriority=priority&&priority.checked;
  if(isPriority)state.tasks.forEach(function(t){t.eatTheFrog=false});
  state.tasks.push({
    id:genId(),
    title:input.value.trim(),
    goalId:goal?goal.value||null:null,
    description:'',
    completed:false,
    createdAt:new Date().toISOString(),
    dueDate:state.selectedDate,
    startTime:startTime,
    endTime:null,
    duration:null,
    eisenhower:null,
    eatTheFrog:isPriority,
    todayTask:state.selectedDate===today(),
    subtasks:[],
    tags:[],
    pomodoroCount:0
  });
  persistTasks();
  pageRender();
  toast('Task added for '+fmtDateShort(state.selectedDate),'success');
}

function pageRender(){
  var content=document.getElementById('content');
  if(content)content.innerHTML=renderCalendarView();
  renderQuickStats();
  renderHeader();
  updateLucide();
}

window.selectDate=selectDate;
window.navMonth=navMonth;
window.calAddTask=calAddTask;
window.pageRender=pageRender;

document.addEventListener('DOMContentLoaded',function(){
  if(window.lucide){lucide.createIcons();commonInit();pageRender()}
  else{setTimeout(function(){commonInit();pageRender()},200)}
});
</script>
</body>
</html>

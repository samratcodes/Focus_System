# Sized for machines with ~8 GB RAM. Raise -Xmx if builds run out of memory.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Compile Kotlin inside the Gradle process instead of a second daemon (saves memory).
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.enableJetifier=true
